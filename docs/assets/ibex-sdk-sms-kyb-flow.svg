<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px Arial, sans-serif; fill: #111827; }
      .small { font: 12px Arial, sans-serif; fill: #374151; }
      .box { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; rx: 10; ry: 10; }
      .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
      .io { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 10; ry: 10; }
      .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; rx: 10; ry: 10; }
      .wait { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; rx: 10; ry: 10; }
      .line { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="30" y="38" class="title">IBEx SDK Flow: SMS Sign-up - KYB - Status (Webhook/WS) - Add IBAN</text>

  <!-- Main flow boxes -->
  <rect x="60" y="90" width="220" height="64" class="box" />
  <text x="95" y="118" class="label">1) Init SDK</text>
  <text x="82" y="138" class="small">createIbexSdk(...)</text>

  <rect x="340" y="90" width="280" height="64" class="box" />
  <text x="370" y="118" class="label">2) SMS sign-up (KYB)</text>
  <text x="364" y="138" class="small">signUpWithSms(telephone, email, SIREN)</text>

  <rect x="680" y="90" width="260" height="64" class="box" />
  <text x="714" y="118" class="label">3) Start KYB session</text>
  <text x="702" y="138" class="small">getKycIframeUrl(language)</text>

  <rect x="1000" y="90" width="220" height="64" class="box" />
  <text x="1030" y="118" class="label">4) User KYB journey</text>
  <text x="1033" y="138" class="small">iframe / full URL</text>

  <!-- Status channels -->
  <rect x="160" y="250" width="350" height="82" class="io" />
  <text x="190" y="278" class="label">A) WebSocket status channel</text>
  <text x="180" y="300" class="small">createRealtimeClient().connect()</text>
  <text x="180" y="320" class="small">listen: user_ky_updated / user_iban_updated</text>

  <rect x="760" y="250" width="380" height="82" class="io" />
  <text x="790" y="278" class="label">B) Webhook status channel</text>
  <text x="780" y="300" class="small">configure /v1.2/domain/kv (x-api-key)</text>
  <text x="780" y="320" class="small">receive event: user.ky.updated on your backend</text>

  <!-- Poll/check -->
  <rect x="450" y="390" width="350" height="70" class="box" />
  <text x="500" y="418" class="label">5) Read authoritative status</text>
  <text x="500" y="438" class="small">getMe() -> kycStatus.kycLevel</text>

  <!-- Decision -->
  <polygon points="625,500 760,570 625,640 490,570" class="decision" />
  <text x="570" y="565" class="label">KY == 5 ?</text>
  <text x="535" y="585" class="small">(business gate)</text>

  <!-- outcomes -->
  <rect x="860" y="540" width="280" height="72" class="ok" />
  <text x="905" y="568" class="label">6) Create IBAN</text>
  <text x="885" y="588" class="small">addSepaIban(holderName, safeAddress?)</text>

  <rect x="120" y="540" width="280" height="72" class="wait" />
  <text x="166" y="568" class="label">Wait and continue listening</text>
  <text x="174" y="588" class="small">next WS/Webhook update -> recheck</text>

  <rect x="955" y="660" width="170" height="56" class="ok" />
  <text x="1015" y="693" class="label">Done</text>

  <!-- Main arrows -->
  <path d="M280 122 L340 122" class="line" />
  <path d="M620 122 L680 122" class="line" />
  <path d="M940 122 L1000 122" class="line" />

  <path d="M1090 154 L1090 220 L335 220 L335 250" class="line" />
  <path d="M1090 154 L1090 250" class="line" />

  <path d="M510 291 L625 291 L625 390" class="line" />
  <path d="M760 291 L760 390" class="line" />

  <path d="M625 460 L625 500" class="line" />

  <!-- decision branches -->
  <path d="M760 570 L860 570" class="line" />
  <text x="808" y="555" class="small">Yes</text>

  <path d="M490 570 L400 570" class="line" />
  <text x="430" y="555" class="small">No</text>

  <path d="M260 540 L260 430 L450 430" class="dash" />
  <path d="M1140 576 L1040 576 L1040 660" class="line" />

  <!-- legend -->
  <rect x="30" y="684" width="480" height="56" fill="#ffffff" stroke="#d1d5db" />
  <rect x="44" y="700" width="20" height="14" class="box" />
  <text x="72" y="712" class="small">SDK/API action</text>
  <rect x="190" y="700" width="20" height="14" class="io" />
  <text x="218" y="712" class="small">Status channel</text>
  <polygon points="360,700 376,707 360,714 344,707" class="decision" />
  <text x="386" y="712" class="small">Decision gate</text>
  <text x="44" y="732" class="small">Tip: in Markdown preview, this SVG renders as a real graphic.</text>
</svg>
